<!DOCTYPE html>
<html>
<head>
    <title>IP Grabber</title>
</head>
<body>
    <h2>Click the button to get your IP address</h2>
    <button onclick="getIP()">Get My IP</button>

    <script>
        function getIP() {
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    const ip = data.ip;
                    alert("Your IP address is: " + ip);
                    // You can also send this to your server here
                    console.log("Your IP: " + ip);
                })
                .catch(error => {
                    console.error('Error fetching IP:', error);
                });
        }
    </script>
</body>
</html>
